name: factorix

x-app-env: &app-env
  DATABASE_URL: postgres://factorix:factorix@postgres:5432/factorix
  REDIS_URL: redis://redis:6379
  FACTORIX_SECRET_KEY: ${FACTORIX_SECRET_KEY:?Set FACTORIX_SECRET_KEY in .env (openssl rand -base64 32)}
  FACTORIX_PUBLIC_URL: ${FACTORIX_PUBLIC_URL:-http://localhost:4101}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  FACTORIX_ALLOW_SCRIPTED_RUNTIME: ${FACTORIX_ALLOW_SCRIPTED_RUNTIME:-false}
  FACTORIX_RUN_CONCURRENCY: ${FACTORIX_RUN_CONCURRENCY:-}
  FACTORIX_SYNC_INTERVAL_SECONDS: ${FACTORIX_SYNC_INTERVAL_SECONDS:-}
  FACTORIX_CLOSED_ISSUE_DAYS: ${FACTORIX_CLOSED_ISSUE_DAYS:-}
  FACTORIX_NOTE_DEBOUNCE_MINUTES: ${FACTORIX_NOTE_DEBOUNCE_MINUTES:-}
  FACTORIX_CI_WAIT_MINUTES: ${FACTORIX_CI_WAIT_MINUTES:-}
  FACTORIX_CLEAR_RUN_CACHE: ${FACTORIX_CLEAR_RUN_CACHE:-}
  FACTORIX_FINISHED_WORKSPACE_HOURS: ${FACTORIX_FINISHED_WORKSPACE_HOURS:-}
  FACTORIX_FAILED_WORKSPACE_DAYS: ${FACTORIX_FAILED_WORKSPACE_DAYS:-}
  FACTORIX_OPEN_WORKSPACE_DAYS: ${FACTORIX_OPEN_WORKSPACE_DAYS:-}
  FACTORIX_FAILED_CONTAINER_HOURS: ${FACTORIX_FAILED_CONTAINER_HOURS:-}
  FACTORIX_SESSION_DAYS: ${FACTORIX_SESSION_DAYS:-}
  FACTORIX_PREVIEW_URL: ${FACTORIX_PREVIEW_URL:-http://preview.localhost:4102}
  FACTORIX_PREVIEW_MAX_RUNNING: ${FACTORIX_PREVIEW_MAX_RUNNING:-}
  FACTORIX_PREVIEW_IDLE_MINUTES: ${FACTORIX_PREVIEW_IDLE_MINUTES:-}
  FACTORIX_PREVIEW_MAX_HOURS: ${FACTORIX_PREVIEW_MAX_HOURS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: factorix
      POSTGRES_PASSWORD: factorix
      POSTGRES_DB: factorix
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - fx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factorix]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [fx-backend]

  redis:
    image: redis:7
    command: [redis-server, --appendonly, "yes"]
    ports:
      - 127.0.0.1:56379:6379
    volumes:
      - fx-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [fx-backend]

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: factorix/api:dev
    command: [node_modules/.bin/tsx, packages/db/src/migrate-cli.ts]
    environment:
      DATABASE_URL: postgres://factorix:factorix@postgres:5432/factorix
    depends_on:
      postgres: { condition: service_healthy }
    networks: [fx-backend]

  api:
    image: factorix/api:dev
    pull_policy: never
    environment:
      <<: *app-env
      PORT: 4100
    ports:
      - 127.0.0.1:4100:4100
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [fx-backend, fx-public]

  worker:
    image: factorix/api:dev
    pull_policy: never
    command: [node_modules/.bin/tsx, apps/api/src/worker.ts]
    user: root
    environment:
      <<: *app-env
      FACTORIX_SANDBOX_IMAGE: ${FACTORIX_SANDBOX_IMAGE:-factorix/sandbox-base:dev}
      FACTORIX_STEP_NETWORK: fx-egress
      FACTORIX_AGENT_NETWORK: fx-agents
      FACTORIX_PROXY_URL: http://egress-proxy:8080
      FACTORIX_STACK: factorix
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      egress-proxy: { condition: service_started }
    restart: unless-stopped
    networks: [fx-backend, fx-public]

  # The only way out for agents: internal network on one side, the internet on the other.
  egress-proxy:
    image: factorix/api:dev
    pull_policy: never
    command: [node_modules/.bin/tsx, apps/egress-proxy/src/index.ts]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8080
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    labels:
      factorix.role: egress
      factorix.stack: factorix
    restart: unless-stopped
    networks: [fx-backend, fx-agents, fx-egress]

  # The only way in to previews. The worker connects it to each preview's own network.
  preview-gateway:
    image: factorix/api:dev
    pull_policy: never
    command: [node_modules/.bin/tsx, apps/preview-gateway/src/index.ts]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4102
      FACTORIX_PREVIEW_URL: ${FACTORIX_PREVIEW_URL:-http://preview.localhost:4102}
    labels:
      factorix.role: gateway
      factorix.stack: factorix
    ports:
      - ${FACTORIX_WEB_BIND:-127.0.0.1}:4102:4102
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [fx-backend]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_URL: http://api:4100
        FACTORIX_PUBLIC_URL: ${FACTORIX_PUBLIC_URL:-http://localhost:4101}
        FACTORIX_PREVIEW_URL: ${FACTORIX_PREVIEW_URL:-http://preview.localhost:4102}
    image: factorix/web:dev
    ports:
      - ${FACTORIX_WEB_BIND:-127.0.0.1}:4101:4101
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [fx-public]

  # HTTPS on a server, turned on by `./install.sh --domain`, which writes COMPOSE_PROFILES=https to .env.
  https:
    image: caddy:2
    profiles: [https]
    network_mode: host
    environment:
      FACTORIX_DOMAIN: ${FACTORIX_DOMAIN:-}
      FACTORIX_PREVIEW_DOMAIN: ${FACTORIX_PREVIEW_DOMAIN:-}
      FACTORIX_ACME_EMAIL: ${FACTORIX_ACME_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - fx-caddy:/data
    depends_on:
      web: { condition: service_started }
      preview-gateway: { condition: service_started }
    restart: unless-stopped

  sandbox-image:
    build: { context: ., dockerfile: docker/sandbox.Dockerfile }
    image: ${FACTORIX_SANDBOX_IMAGE:-factorix/sandbox-base:dev}
    profiles: [build-only]

volumes:
  fx-postgres:
  fx-redis:
  fx-caddy:

networks:
  fx-backend:
  fx-public:
  fx-agents:
    name: fx-agents
    internal: true
  fx-egress:
    name: fx-egress
